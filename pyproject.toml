[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-babelc"
version = "0.1.0"
description = "Python/libclang D-Bus IPC code generator — replacement for babelc"
requires-python = ">=3.10"
dependencies = [
    "pymonad>=2.4.0",
    "Jinja2>=3.1.0",
    "libclang>=16.0.0",
]

[project.scripts]
py-babelc = "babelc_py.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["babelc_py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
